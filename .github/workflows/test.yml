name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # The full gate from AGENTS.md section 7: install from the lockfile, types,
  # lint, unit and component tests (Vitest, with Chromium for the component
  # project), the production build, and Playwright in Chromium, Firefox and
  # WebKit at desktop and phone sizes against the built Node server.
  web:
    runs-on: ubuntu-latest
    # Playwright's system packages come from Ubuntu's mirror, which can be slow.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Before the tests: the Vitest component project runs in Chromium.
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
