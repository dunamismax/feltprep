# /etc/systemd/system/feltprep.service.d/50-resource-boundaries.conf:
# installed by deploy/cutover.sh. The contract's default limits for a web unit
# (ubuntu-vm-backup docs/web-platform.md, section 5); raise them only after
# measuring, for example when a practice opponent's bundle is loaded (Q-9).
[Service]
MemoryHigh=256M
MemoryMax=512M
TasksMax=128
